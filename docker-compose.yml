services:
  postgres:
    image: postgres:16
    container_name: job_market_postgres
    environment:
      POSTGRES_DB: job_market_db
      POSTGRES_USER: job_market_user
      POSTGRES_PASSWORD: job_market_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_market_user -d job_market_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: